name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with the module attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          $version = (Import-PowerShellDataFile ./DbxToolbox/DbxToolbox.psd1).ModuleVersion
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "Tag $env:GITHUB_REF_NAME doesn't match ModuleVersion $version in DbxToolbox.psd1"
          }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append

      - name: Unit tests
        run: |
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.9.1
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Filter.Tag = 'Unit'
          Invoke-Pester -Configuration $config

      - name: Zip the module and take the notes from CHANGELOG.md
        run: |
          # The zip holds the DbxToolbox folder, so unzipping into a Modules folder just works.
          Compress-Archive -Path ./DbxToolbox -DestinationPath "./DbxToolbox-$env:VERSION.zip"
          $lines = Get-Content ./CHANGELOG.md
          # StartsWith, not -like: [ ] are wildcards to -like.
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].StartsWith("## [$env:VERSION]")) { $start = $i; break } }
          if ($start -lt 0) { throw "No '## [$env:VERSION]' section in CHANGELOG.md" }
          $end = $start + 1
          while ($end -lt $lines.Count -and -not $lines[$end].StartsWith('## ')) { $end++ }
          $lines[($start + 1)..($end - 1)] | Out-File ./notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "./DbxToolbox-$env:VERSION.zip" --title "DbxToolbox $env:VERSION" --notes-file ./notes.md
